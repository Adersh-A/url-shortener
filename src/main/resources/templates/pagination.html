<nav th:if="${shortUrls.totalPages > 1}" class="pagination-wrapper">
    <div class="pagination-container">
        <!-- Left controls -->

        <div class="pagination-controls">
            <a class="pagination-btn" th:classappend="${shortUrls.isFirst ? 'disabled' : ''}"
               th:href="@{${paginationUrl}(page=1)}">
                First
            </a>

            <a class="pagination-btn" th:classappend="${shortUrls.isFirst ? 'disabled' : ''}"
               th:href="@{${paginationUrl}(page=${shortUrls.pageNumber - 1})}">
                Previous
            </a>
        </div>

        <!-- Page info -->

        <div class="pagination-info">
            <span th:text="${'Page ' + shortUrls.pageNumber + ' of ' + shortUrls.totalPages}">
                Page 1 of 10
            </span>

            <span class="pagination-total" th:text="${'• ' + shortUrls.totalElements + ' total'}">
                • 200 total
            </span>
        </div>

        <!-- Right controls -->

        <div class="pagination-controls">
            <a class="pagination-btn" th:classappend="${shortUrls.isLast ? 'disabled' : ''}"
               th:href="@{${paginationUrl}(page=${shortUrls.pageNumber + 1})}">
                Next
            </a>

            <a class="pagination-btn" th:classappend="${shortUrls.isLast ? 'disabled' : ''}"
               th:href="@{${paginationUrl}(page=${shortUrls.totalPages})}">
                Last
            </a>
        </div>
    </div>
</nav>
