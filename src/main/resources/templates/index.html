<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<body>
<div layout:fragment="content">
    <!-- Hero Section -->

    <div class="hero">
        <div class="hero-title">Make long links simple</div>

        <div class="hero-subtitle">
            Generate short, reliable links you can share anywhere.
        </div>
    </div>

    <!-- Create URL -->

    <div class="minimal-card">
        <div class="section-title">Create new short link</div>

        <form th:action="@{/short-urls}" method="post" th:object="${createShortUrlForm}">
            <div class="mb-3">
                <label class="form-label"> Destination URL </label>

                <input type="text" class="form-control" th:field="*{originalUrl}"
                       placeholder="Paste your long URL here" />

                <div class="text-danger mt-1" th:if="${#fields.hasErrors('originalUrl')}"
                     th:errors="*{originalUrl}"></div>
            </div>

            <div class="mb-3" sec:authorize="isAuthenticated()">
                <label class="form-label"> Link expiration (optional) </label>

                <input type="number" class="form-control" th:field="*{expirationInDays}" min="1" max="365"
                       placeholder="Number of days" />

                <div class="form-text">
                    Leave blank to keep this link active permanently.
                </div>
            </div>

            <div class="form-check mb-3" sec:authorize="isAuthenticated()">
                <input class="form-check-input" type="checkbox" th:field="*{isPrivate}" />

                <label class="form-check-label">
                    Restrict access to your account only
                </label>
            </div>

            <button type="submit" class="btn btn-primary">
                Create short link
            </button>
        </form>
    </div>

    <!-- Public Links Table -->

    <div class="table-container">
        <div class="section-title">Recently created public links</div>

        <div th:if="${shortUrls.data.isEmpty()}" class="empty-state">
            No public links available yet.
        </div>

        <div th:unless="${shortUrls.data.isEmpty()}">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Short Link</th>

                        <th>Destination</th>

                        <th>Created By</th>

                        <th>Created On</th>

                        <th>Expires</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="url : ${shortUrls.data}">
                        <td>
                            <a th:href="@{/s/{key}(key=${url.shortKey})}"
                               th:text="${baseUrl + '/s/' + url.shortKey}" target="_blank" class="url-link">
                            </a>
                        </td>

                        <td>
                            <a th:href="${url.originalUrl}"
                               th:text="${#strings.abbreviate(url.originalUrl, 50)}" target="_blank">
                            </a>
                        </td>

                        <td th:text="${url.createdBy != null ? url.createdBy.name : 'Guest'}"></td>

                        <td th:text="${#temporals.format(url.createdAt, 'yyyy-MM-dd HH:mm')}"></td>

                        <td
                                th:text="${url.expiresAt != null ? #temporals.format(url.expiresAt, 'yyyy-MM-dd HH:mm') : 'Never'}">
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:insert="~{pagination}"></div>
        </div>
    </div>
</div>
</body>

</html>
